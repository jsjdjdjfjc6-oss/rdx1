name: Windows Runtime Environment Validation

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Session Password'
        required: true
        default: 'Paneer@12345!'
      ngrok_token:
        description: 'Optional Ngrok Token (Leave blank to use Pinggy TCP)'
        required: false
        default: ''
  push:
    paths:
      - 'trigger_build.txt'

jobs:
  windows-session:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Configure Windows Remote Desktop and Multi-Tunnel
        shell: powershell
        run: |
          .\scripts\setup_rdp.ps1 -TargetPassword "${{ github.event.inputs.password || 'Paneer@12345!' }}" -NgrokToken "${{ github.event.inputs.ngrok_token || '' }}"

      - name: 3. Export Connection Info Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-connection-info
          path: connection_info.txt
          retention-days: 1

      - name: 4. Maintain Active Session
        shell: powershell
        run: |
          Write-Host "Windows session active for up to 6 hours. Cancel workflow anytime to stop."
          Start-Sleep -Seconds 21600
