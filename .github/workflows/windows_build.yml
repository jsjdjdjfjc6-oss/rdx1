name: Windows Runtime Environment Validation

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Session Password'
        required: true
        default: 'Paneer@12345!'
      playit_secret:
        description: 'Playit Agent Secret Key'
        required: false
        default: '9ad05c2cb7d8e04ac490f6b963ec4f71f9774cfa5e05127ac5f5c9c9f8a5cf32'
  push:
    paths:
      - 'trigger_build.txt'

jobs:
  windows-session:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Configure Windows Remote Desktop and Playit Tunnel
        shell: powershell
        run: |
          $secret = "${{ github.event.inputs.playit_secret }}"
          if ([string]::IsNullOrWhiteSpace($secret)) { $secret = "9ad05c2cb7d8e04ac490f6b963ec4f71f9774cfa5e05127ac5f5c9c9f8a5cf32" }
          $pass = "${{ github.event.inputs.password }}"
          if ([string]::IsNullOrWhiteSpace($pass)) { $pass = "Paneer@12345!" }
          .\scripts\setup_rdp.ps1 -TargetPassword $pass -PlayitSecret $secret

      - name: 3. Export Connection Info Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-connection-info
          path: connection_info.txt
          retention-days: 1

      - name: 4. Maintain Active Session and Playit Daemon
        shell: powershell
        run: |
          Write-Host "Windows session active. Beginning keepalive monitoring..."
          $playitBin = "$env:TEMP\playitd.exe"
          $secret = "9ad05c2cb7d8e04ac490f6b963ec4f71f9774cfa5e05127ac5f5c9c9f8a5cf32"
          $playitLog = "$env:TEMP\playit.log"
          
          for ($m = 1; $m -le 360; $m++) {
              Start-Sleep -Seconds 60
              $pProc = Get-Process -Name "playitd" -ErrorAction SilentlyContinue
              $rdpTest = (Test-NetConnection -ComputerName 127.0.0.1 -Port 3389).TcpTestSucceeded
              Write-Host "[Heartbeat] Elapsed: $m mins | Local RDP 3389: $rdpTest | Playit Daemon Running: $([bool]$pProc)"
              
              if (-not $pProc -and (Test-Path $playitBin)) {
                  Write-Host "Restarting Playit Daemon..."
                  Start-Process -FilePath $playitBin -ArgumentList "--secret", "$secret", "--platform-docker", "-l", "$playitLog"
              }
          }
