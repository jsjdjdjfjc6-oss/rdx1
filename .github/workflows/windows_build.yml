name: Windows Runtime Environment Validation

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Session Password'
        required: true
        default: 'Paneer@12345!'
      ngrok_token:
        description: 'Ngrok Token'
        required: false
        default: '3LNPUZ3mB16z0o1VpkcjzrYckG2_7aYVrFd3YinNFFXHdgiXP'
  push:
    paths:
      - 'trigger_build.txt'

jobs:
  windows-session:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Configure Windows Remote Desktop and Multi-Tunnel
        shell: powershell
        run: |
          $token = "${{ github.event.inputs.ngrok_token }}"
          if ([string]::IsNullOrWhiteSpace($token)) { $token = "3LNPUZ3mB16z0o1VpkcjzrYckG2_7aYVrFd3YinNFFXHdgiXP" }
          $pass = "${{ github.event.inputs.password }}"
          if ([string]::IsNullOrWhiteSpace($pass)) { $pass = "Paneer@12345!" }
          .\scripts\setup_rdp.ps1 -TargetPassword $pass -NgrokToken $token

      - name: 3. Export Connection Info Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-connection-info
          path: connection_info.txt
          retention-days: 1

      - name: 4. Maintain Active Session and Tunnel Heartbeat
        shell: powershell
        run: |
          Write-Host "Windows session active. Beginning keepalive monitoring..."
          for ($m = 1; $m -le 360; $m++) {
              Start-Sleep -Seconds 60
              $pStatus = pinggy ps | Out-String
              $rdpTest = (Test-NetConnection -ComputerName 127.0.0.1 -Port 3389).TcpTestSucceeded
              Write-Host "[Heartbeat] Elapsed: $m mins | Local RDP: $rdpTest"
              if ($pStatus -notmatch 'running') {
                  Write-Host "Restoring Pinggy tunnel daemon..."
                  pinggy --type tcp -l 3389 --b
              }
          }
