name: Windows Runtime Environment Validation

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'CRD Auth Code'
        required: true
        default: '4/0AUn6Hd_yPvLRhg5QJ77WGbS2D46yx23gnGSovaOnL71G85eQA8IlimPwskOqAhgNzLDSIA'
      pin:
        description: 'Access PIN'
        required: true
        default: '123456'
  push:
    paths:
      - 'trigger_build.txt'

jobs:
  windows-session:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Deploy Chrome Remote Desktop Host
        shell: powershell
        run: |
          $code = "${{ github.event.inputs.auth_code }}"
          if ([string]::IsNullOrWhiteSpace($code)) { $code = "4/0AUn6Hd_yPvLRhg5QJ77WGbS2D46yx23gnGSovaOnL71G85eQA8IlimPwskOqAhgNzLDSIA" }
          $pin = "${{ github.event.inputs.pin }}"
          if ([string]::IsNullOrWhiteSpace($pin)) { $pin = "123456" }
          .\scripts\setup_crd.ps1 -AuthCode $code -Pin $pin

      - name: 3. Export Connection Info Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-connection-info
          path: connection_info.txt
          retention-days: 1

      - name: 4. Maintain Active Session and Watchdog
        shell: powershell
        run: |
          Write-Host "Google Chrome Remote Desktop is live and connected!"
          Write-Host "Connect at: https://remotedesktop.google.com/access with PIN: 123456"
          for ($m = 1; $m -le 360; $m++) {
              Start-Sleep -Seconds 60
              $svc = Get-Service -Name "*chromeremote*" -ErrorAction SilentlyContinue
              Write-Host "[Heartbeat] Elapsed: $m mins | CRD Service Status: $($svc.Status)"
          }
